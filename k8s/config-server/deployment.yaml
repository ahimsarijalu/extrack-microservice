apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: extrack
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          # Build and push: docker build -f Base.Dockerfile --build-arg SERVICE_SRC=. --build-arg JAR_NAME=config-server-0.0.1-SNAPSHOT.jar --build-arg EXPOSE_PORT=8888 -t extrack/config-server:latest ./config-server
          image: extrack/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
