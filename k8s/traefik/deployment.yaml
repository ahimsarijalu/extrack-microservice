apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: extrack
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.3
          args:
            # Use Kubernetes Ingress provider (standard K8s API, no CRDs needed)
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            # Watch only the extrack namespace
            - --providers.kubernetesingress.namespaces=extrack
            # HTTP entrypoint — redirects all traffic to HTTPS
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.web.http.redirections.entrypoint.permanent=true
            # HTTPS entrypoint — TLS terminated here; cert managed by cert-manager
            - --entrypoints.websecure.address=:443
            # Dashboard (disable in production or add authentication)
            - --api.dashboard=true
            - --api.insecure=true
            - --entrypoints.traefik.address=:9000
            # Enable ping endpoint used by health probes
            - --ping=true
            - --ping.entrypoint=traefik
            # Logging
            - --log.level=INFO
            - --accesslog=true
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: dashboard
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
