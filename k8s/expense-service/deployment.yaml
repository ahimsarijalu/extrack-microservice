apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-service
  namespace: extrack
  labels:
    app: expense-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-service
  template:
    metadata:
      labels:
        app: expense-service
    spec:
      initContainers:
        - name: wait-for-expense-db
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z expense-db 5432; do
                echo "Waiting for expense-db to be ready..."
                sleep 5
              done
      containers:
        - name: expense-service
          # Build and push: docker build -f Base.Dockerfile --build-arg SERVICE_SRC=. --build-arg JAR_NAME=expense-service-0.0.1-SNAPSHOT.jar --build-arg EXPOSE_PORT=8080 -t extrack/expense-service:latest ./expense-service
          image: extrack/expense-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: EXPENSE_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: EXPENSE_POSTGRES_USER
            - name: EXPENSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: EXPENSE_POSTGRES_PASSWORD
            - name: EXPENSE_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: EXPENSE_POSTGRES_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
