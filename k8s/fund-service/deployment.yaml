apiVersion: apps/v1
kind: Deployment
metadata:
  name: fund-service
  namespace: extrack
  labels:
    app: fund-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fund-service
  template:
    metadata:
      labels:
        app: fund-service
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://eureka-service:8761/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do
                echo "Waiting for eureka-service to be ready..."
                sleep 5
              done
        - name: wait-for-fund-db
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z fund-db 5432; do
                echo "Waiting for fund-db to be ready..."
                sleep 5
              done
      containers:
        - name: fund-service
          # Build and push: docker build -f Base.Dockerfile --build-arg SERVICE_SRC=. --build-arg JAR_NAME=fund-service-0.0.1-SNAPSHOT.jar --build-arg EXPOSE_PORT=8080 -t extrack/fund-service:latest ./fund-service
          image: extrack/fund-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: FUND_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fund-secret
                  key: FUND_POSTGRES_USER
            - name: FUND_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fund-secret
                  key: FUND_POSTGRES_PASSWORD
            - name: FUND_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fund-secret
                  key: FUND_POSTGRES_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fund-secret
                  key: JWT_SECRET
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka/"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
