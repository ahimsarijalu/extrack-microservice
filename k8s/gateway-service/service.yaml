apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: extrack
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  # Use LoadBalancer for cloud environments (GKE, EKS, AKS).
  # Change to NodePort for local clusters (minikube, kind).
  type: LoadBalancer
