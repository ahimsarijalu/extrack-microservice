# Allow Traefik (the edge gateway) to reach each domain service.
# Traefik is the only external entry point; no other pod may initiate
# connections to the domain services from outside their own group.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-auth
  namespace: extrack
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 8080

