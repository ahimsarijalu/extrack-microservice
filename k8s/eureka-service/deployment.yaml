apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: extrack
  labels:
    app: eureka-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-service
  template:
    metadata:
      labels:
        app: eureka-service
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://config-server:8888/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do
                echo "Waiting for config-server to be ready..."
                sleep 5
              done
      containers:
        - name: eureka-service
          # Build and push: docker build -f Base.Dockerfile --build-arg SERVICE_SRC=. --build-arg JAR_NAME=eureka-service-0.0.1-SNAPSHOT.jar --build-arg EXPOSE_PORT=8761 -t extrack/eureka-service:latest ./eureka-service
          image: extrack/eureka-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
