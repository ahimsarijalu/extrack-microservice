apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-db
  namespace: extrack
  labels:
    app: expense-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: expense-db
    spec:
      containers:
        - name: expense-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: EXPENSE_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: EXPENSE_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: expense-secret
                  key: EXPENSE_POSTGRES_DB
          volumeMounts:
            - name: expense-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: expense-db-data
          persistentVolumeClaim:
            claimName: expense-db-pvc
