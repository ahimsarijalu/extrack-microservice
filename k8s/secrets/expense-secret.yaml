apiVersion: v1
kind: Secret
metadata:
  name: expense-secret
  namespace: extrack
type: Opaque
# Replace these placeholder values with real credentials before applying.
# Values in stringData are automatically base64-encoded by Kubernetes.
stringData:
  EXPENSE_POSTGRES_USER: "expense_user"
  EXPENSE_POSTGRES_PASSWORD: "change-me-expense-password"
  EXPENSE_POSTGRES_DB: "expense_db"
  JWT_SECRET: "change-me-jwt-secret-must-be-at-least-256-bits-long"
