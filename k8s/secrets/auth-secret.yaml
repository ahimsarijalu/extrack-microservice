apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: extrack
type: Opaque
# Replace these placeholder values with real credentials before applying.
# Values in stringData are automatically base64-encoded by Kubernetes.
stringData:
  AUTH_POSTGRES_USER: "auth_user"
  AUTH_POSTGRES_PASSWORD: "change-me-auth-password"
  AUTH_POSTGRES_DB: "auth_db"
  JWT_SECRET: "change-me-jwt-secret-must-be-at-least-256-bits-long"
